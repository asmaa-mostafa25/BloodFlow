name: CI

on:
  push:
    branches: [ master, 'feature/**' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore BloodFlow.slnx

      - name: Build
        run: dotnet build BloodFlow.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test BloodFlow.slnx --no-build --configuration Release --verbosity normal

      - name: Check vulnerable packages
        run: dotnet list BloodFlow.slnx package --vulnerable --include-transitive
